# Temporary, fork-only build helper. Remove after compiled assets are committed.
name: Rebuild admin assets for issue 332
on:
  push:
    branches:
      - fix/332-overview-retry-block-count

permissions: {}

jobs:
  build-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build admin dashboard assets
        run: npm run admin:build
      - name: Upload dashboard assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-assets-332
          path: |
            assets/admin/js/dashboard.js
            assets/admin/js/dashboard.asset.php
          if-no-files-found: error
  commit-assets:
    needs: build-admin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download dashboard assets
        uses: actions/download-artifact@v4
        with:
          name: dashboard-assets-332
          path: assets/admin/js
      - name: Commit only rebuilt dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/admin/js/dashboard.js assets/admin/js/dashboard.asset.php
          if git diff --cached --quiet; then
            echo "Dashboard assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(admin): refresh compiled dashboard for issue 332" -m "Closes noruzzamans/gslider-blocks#332"
          git push origin "HEAD:fix/332-overview-retry-block-count"
